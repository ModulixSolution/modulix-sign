name: Modulix Sign image
on:
  push:
    branches: [modulix-branding, modulix-3.3.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ghcr.io/modulixsolution/modulix-sign:3.3.1-m1
            ghcr.io/modulixsolution/modulix-sign:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "DIGEST=${{ steps.build.outputs.digest }}" | tee -a $GITHUB_STEP_SUMMARY
